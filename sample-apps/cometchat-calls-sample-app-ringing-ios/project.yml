name: CometChatCallsRinging
options:
  bundleIdPrefix: com.cometchat
  deploymentTarget:
    iOS: "15.1"
  xcodeVersion: "16.0"
packages:
  CometChatCallsSDK:
    path: ../../
  CometChatSDK:
    url: https://github.com/cometchat/chat-sdk-ios.git
    from: 4.1.10
  CometChatPushNotifications:
    url: https://github.com/cometchat/push-notifications-sdk-ios.git
    from: 2.0.0
targets:
  CometChatCallsRinging:
    type: application
    platform: iOS
    sources:
      - path: CometChatCallsRinging
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cometchat.calls.ringing
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: CometChatCallsRinging/CometChatCallsRinging.entitlements
      properties:
        # Needed for VoIP (PushKit) registration. A TestFlight or App Store build needs "production".
        aps-environment: development
    info:
      path: CometChatCallsRinging/Info.plist
      properties:
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_TYPE)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        UILaunchScreen: {}
        NSCameraUsageDescription: "Camera access is required for video calls"
        NSMicrophoneUsageDescription: "Microphone access is required for voice and video calls"
        UIBackgroundModes:
          - audio
          - voip
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - package: CometChatCallsSDK
        product: CometChatCallsSDK
      - package: CometChatSDK
        product: CometChatSDK
      - package: CometChatPushNotifications
        product: CometChatPushNotificationsCalls
